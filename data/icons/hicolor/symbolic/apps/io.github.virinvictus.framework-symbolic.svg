<!-- Framework symbolic icon. Single-colour on the 16px grid, content kept
     inside the conventional 2px margin. GTK recolours any icon whose name
     ends in "-symbolic", so the #bebebe fill is only a fallback tone.
     The colour icon's outer frame is dropped here: at 16px it collapses
     into the page edge. The folded page is what stays legible. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Page shell: outer silhouette with a cut corner, hollowed by an
       even-odd inner path that follows the same diagonal so the outline
       keeps a uniform 1px weight all the way round the fold. -->
  <path fill="#bebebe" fill-rule="evenodd"
        d="M 3 2 H 9 L 13 6 V 14 H 3 Z
           M 4 3 V 13 H 12 V 6.4 L 8.6 3 Z"/>
  <!-- The turned corner, filled solid -->
  <path fill="#bebebe" d="M 9 2 L 13 6 H 9 Z"/>
  <!-- Two text rules; a third turns to noise at this size. Both sit on
       whole-pixel y so they stay crisp instead of antialiasing across
       two rows the way a half-pixel offset would. -->
  <rect fill="#bebebe" x="5" y="8" width="5" height="1"/>
  <rect fill="#bebebe" x="5" y="10" width="5" height="1"/>
</svg>
