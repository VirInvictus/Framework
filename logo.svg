<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120">
  <style>
    .logo-text { fill: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .logo-text { fill: #f0f0f0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
  </defs>

  <!-- Icon portion -->
  <g transform="translate(10, 4)">
    <!-- Rounded app background -->
    <rect x="0" y="0" width="112" height="112" rx="24" fill="url(#bg)"/>

    <!-- Outer frame -->
    <rect x="16" y="10" width="80" height="92" rx="4" fill="none"
          stroke="#ffffff" stroke-width="2.5" opacity="0.35"/>

    <!-- Document page -->
    <rect x="24" y="17" width="64" height="80" rx="3" fill="url(#page)"/>

    <!-- Dog-ear -->
    <path d="M 74 17 L 88 17 L 88 31 Z" fill="#e0e0e0"/>
    <path d="M 74 17 L 74 31 L 88 31 Z" fill="#d0d0d0"/>

    <!-- Text lines -->
    <rect x="31" y="28" width="32" height="3" rx="1.5" fill="#1a5fb4" opacity="0.7"/>
    <rect x="31" y="36" width="46" height="2.5" rx="1.2" fill="#3d3d3d" opacity="0.4"/>
    <rect x="31" y="42" width="46" height="2.5" rx="1.2" fill="#3d3d3d" opacity="0.4"/>
    <rect x="31" y="48" width="38" height="2.5" rx="1.2" fill="#3d3d3d" opacity="0.4"/>
    <rect x="31" y="54" width="46" height="2.5" rx="1.2" fill="#3d3d3d" opacity="0.4"/>
    <rect x="31" y="60" width="42" height="2.5" rx="1.2" fill="#3d3d3d" opacity="0.4"/>
    <rect x="31" y="66" width="46" height="2.5" rx="1.2" fill="#3d3d3d" opacity="0.4"/>
    <rect x="31" y="72" width="34" height="2.5" rx="1.2" fill="#3d3d3d" opacity="0.4"/>
    <rect x="31" y="78" width="46" height="2.5" rx="1.2" fill="#3d3d3d" opacity="0.4"/>
    <rect x="31" y="84" width="28" height="2.5" rx="1.2" fill="#3d3d3d" opacity="0.4"/>
  </g>

  <!-- Text: "Framework" -->
  <text x="140" y="72" font-family="Inter, Cantarell, sans-serif"
        font-size="46" font-weight="700" class="logo-text"
        letter-spacing="-1">Framework</text>
</svg>
